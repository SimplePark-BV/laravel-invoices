name: CI / Test
run-name: CI | Test

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - main
      - 'release/**'
  push:
    branches:
      - main
  schedule:
    # catch breaking dependency releases between changes
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} (${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        laravel: ['12', '13']
        dependencies: [highest]
        include:
          - php: '8.3'
            laravel: '12'
            dependencies: lowest
          - php: '8.4'
            laravel: '12'
            dependencies: locked

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@2.37.1
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, gd, mbstring
          tools: composer
          coverage: none

      - name: Select Laravel ${{ matrix.laravel }}
        if: matrix.dependencies != 'locked'
        run: composer require --dev --no-update --no-interaction "orchestra/testbench:${{ matrix.laravel == '12' && '^10.0' || '^11.0' }}"

      - name: Install Composer dependencies
        uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # 3.2.1
        with:
          dependency-versions: ${{ matrix.dependencies }}
          composer-options: --prefer-dist --no-progress

      - name: Run tests
        run: vendor/bin/phpunit

  test:
    # the required status check, which passes when every combination of the matrix passes
    name: Test
    if: always()
    needs: matrix
    runs-on: ubuntu-latest

    steps:
      - name: Check the test matrix
        run: test "${{ needs.matrix.result }}" = "success"
